    <text x="636" y="260" class="text-muted">Node/Edge Stats: 147 Nodes, 1,144 RDF Triples, 184 Lift Ties</text>
    <text x="636" y="285" class="text-muted">Neo4j Integration: Optional sync via NEO4J_URI</text>
  </g>

