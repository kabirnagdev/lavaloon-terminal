    <text x="24" y="260" class="text-muted">Rate Governor: 6,500 Tokens/Min Sliding Window</text>
    <text x="24" y="285" class="text-muted">Deterministic Temperature: 0.1 for Grounded Synthesis</text>

    <!-- Graph Storage -->
